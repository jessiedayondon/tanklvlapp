name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.37 setuptools

      - name: Skip Apache Ant download (apache.org resets the connection)
        run: mkdir -p ~/.buildozer/android/platform/apache-ant-1.9.4

      - name: Build (2 attempts, full log saved to build.log)
        run: |
          set -o pipefail
          for i in 1 2; do
            buildozer android debug 2>&1 | tee -a build.log && exit 0
            echo "Attempt $i failed" | tee -a build.log
            sleep 10
          done
          exit 1

      - name: Show the real error
        if: failure()
        run: |
          echo "===== ERROR LINES ====="
          grep -n -E "Error|error:|ERROR|FAILED|Traceback|Exception" build.log | tail -n 40
          echo "===== LAST 60 LINES ====="
          tail -n 60 build.log

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tank-app-apk
          path: bin/*.apk
