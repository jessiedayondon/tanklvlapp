name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Fetch source files using the latest verified Node version runner
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      # 3. Clean Java Setup (Upgraded to v6 to completely eliminate Java & Node deprecation alerts)
      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install all essential build toolchain compiler packages
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            automake \
            libtool

      # 5. Install specific Python deployment utilities
      - name: Install Python Build Dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==3.0.11 buildozer

      # 6. Run the compiled android assembly sequence
      - name: Run Buildozer Build
        run: |
          yes | buildozer android debug

      # 7. Package and upload the completed APK file (Upgraded to clear final warning tags)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Tank-Level-App
          path: bin/*.apk
