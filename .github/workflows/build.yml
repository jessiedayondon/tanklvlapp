name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Buildozer and Android SDK Data
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.android
          ~/.gradle
        key: buildozer-fasttrack-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-fasttrack-${{ runner.os }}-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev openjdk-17-jdk libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
        autoconf automake libtool libtool-bin pkg-config build-essential git ffmpeg libportmidi-dev libswscale-dev \
        libavformat-dev libavcodec-dev zlib1g-dev unzip zip tar python3-dev libffi-dev libssl-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" setuptools sh

    - name: Run Buildozer Build
      run: |
        yes | buildozer android debug

    # ⚡ EXPLICIT RAW BUNDLE EXTRACTOR
    - name: Prepare Direct APK File
      run: |
        mkdir -p deploy
        cp bin/*.apk deploy/TankApp-Installer.apk

    # ⚡ ZIP BYPASS CONFIGURATION
    - name: Upload Raw APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TankApp-Installer
        path: deploy/TankApp-Installer.apk
        compression-level: 0  # Forces an uncompressed, raw stream format
