name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.37 setuptools

      - name: Skip Apache Ant download (apache.org resets the connection)
        run: mkdir -p ~/.buildozer/android/platform/apache-ant-1.9.4

      - name: Build (retries up to 3 times)
        run: |
          for i in 1 2 3; do
            buildozer -v android debug && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: tank-app-apk
          path: bin/*.apk
